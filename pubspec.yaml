name: DISClystics
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.2
  cloud_firestore: ^5.3.0
  firebase_storage: ^12.3.0
  firebase_app_check: ^0.3.2+6
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  permission_handler: ^11.3.0
  device_info_plus: ^11.4.0
  http: ^1.1.0
  image_editor_plus: ^1.0.6
  cached_network_image: ^3.3.1
  fl_chart: ^1.0.0
  screenshot: ^3.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_pdfview: ^1.4.0+1
  path_provider: ^2.1.1
  share_plus: 11.0.0
  image: ^4.0.17
  vector_math: ^2.1.4
  open_file: ^3.5.10
  intl: ^0.19.0
  dio: ^5.8.0+1
  syncfusion_flutter_charts: ^30.1.40
  easy_localization: ^3.0.3
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/google.png
    - assets/translations/en.json
    - assets/translations/ur.json
